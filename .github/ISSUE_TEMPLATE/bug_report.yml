name: 问题反馈
description: 反馈麦麦 AI 桌宠的功能或稳定性问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交 API Key、访问令牌、完整对话或其他敏感信息。
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.3.0 arm64
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 描述实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开……\n2. 点击……\n3. 出现……
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 可粘贴“设置 → 高级设置 → 导出诊断报告”中的非敏感部分。

